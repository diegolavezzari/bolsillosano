<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Bolsillo Sano</title>
    <link rel="stylesheet" href="css/estilo.css?v=26">  <!-- ?v=26: cambiar el número cuando cambia el CSS, así el celular no usa el viejo -->
</head>
<body>

    <!-- Navegador: el mismo de las otras páginas -->
    <nav class="navegador">
        <!-- La marca lleva a la portada -->
        <a href="index.html" class="marca">
            <img src="img/logo_bolsillo_sano.png" alt="Logo de Bolsillo Sano" class="marca-logo">
            <span class="marca-nombre">Bolsillo Sano</span>
        </a>

        <div class="menu">
            <a href="consejos.html">Consejos</a>
            <a href="inversiones.html">Inversiones</a>
            <a href="nosotros.html">Nosotros</a>
        </div>
    </nav>

    <div class="login">
        <div class="login-card">

            <div class="login-logo">
                <h1>Ingresá a tu cuenta</h1>
                <p>Controlá tus gastos, cumplí tus metas</p>
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com">
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••">
            </div>

            <button type="button" id="btn-ingresar" class="boton">Ingresar</button>

            <!-- Vacío: el JS escribe acá si falta algún dato -->
            <p id="mensaje"></p>

            <div class="login-links">
                <!-- href="#" = no lleva a ninguna página: el JS (login.js) manda el mail
                     con el link a nueva-password.html -->
                <p><a href="#" id="link-olvide">¿Olvidaste tu contraseña?</a></p>
                <p>¿No tenés cuenta? <a href="registro.html">Crear cuenta</a></p>
                <a href="index.html">← Volver</a>
            </div>

        </div>
    </div>

    <!-- 1. La librería de Supabase (desde internet) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <!-- 2. Nuestra conexión (usa la librería, por eso va después) -->
    <script src="js/supabase.js"></script>
    <!-- 3. El JS de esta página (usa la conexión, por eso va último) -->
    <script src="js/login.js"></script>
</body>
</html>
