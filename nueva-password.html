<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña - Bolsillo Sano</title>
    <link rel="stylesheet" href="css/estilo.css?v=26">  <!-- ?v=26: cambiar el número cuando cambia el CSS, así el celular no usa el viejo -->
</head>
<body>

    <!-- Navegador: el mismo de las otras páginas (sin "Ingresar", igual que el login) -->
    <nav class="navegador">
        <!-- La marca lleva a la portada -->
        <a href="index.html" class="marca">
            <img src="img/logo_bolsillo_sano.png" alt="Logo de Bolsillo Sano" class="marca-logo">
            <span class="marca-nombre">Bolsillo Sano</span>
        </a>

        <div class="menu">
            <a href="consejos.html">Consejos</a>
            <a href="inversiones.html">Inversiones</a>
            <a href="nosotros.html">Nosotros</a>
        </div>
    </nav>

    <!-- Misma tarjeta que el login: reusa las clases login, login-card, campo, boton -->
    <div class="login">
        <div class="login-card">

            <div class="login-logo">
                <h1>Elegí una nueva contraseña</h1>
                <p>Escribila dos veces para no equivocarte</p>
            </div>

            <div class="campo">
                <label for="password">Nueva contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••">
            </div>

            <div class="campo">
                <label for="confirmar">Repetila</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="••••••••">
            </div>

            <button type="button" id="btn-guardar" class="boton">Guardar contraseña</button>

            <!-- Vacío: el JS escribe acá (si no coinciden, si se guardó, etc.) -->
            <p id="mensaje"></p>

            <div class="login-links">
                <a href="login.html">← Volver al login</a>
            </div>

        </div>
    </div>

    <!-- 1. La librería de Supabase (desde internet) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <!-- 2. Nuestra conexión (usa la librería, por eso va después) -->
    <script src="js/supabase.js"></script>
    <!-- 3. El JS de esta página (usa la conexión, por eso va último) -->
    <script src="js/nueva-password.js"></script>
</body>
</html>
