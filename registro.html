<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Bolsillo Sano</title>
    <link rel="stylesheet" href="css/estilo.css?v=26">  <!-- ?v=26: cambiar el número cuando cambia el CSS, así el celular no usa el viejo -->
</head>
<body>

    <!-- Navegador: el mismo de las otras páginas -->
    <nav class="navegador">
        <!-- La marca lleva a la portada -->
        <a href="index.html" class="marca">
            <img src="img/logo_bolsillo_sano.png" alt="Logo de Bolsillo Sano" class="marca-logo">
            <span class="marca-nombre">Bolsillo Sano</span>
        </a>

        <div class="menu">
            <a href="consejos.html">Consejos</a>
            <a href="inversiones.html">Inversiones</a>
            <a href="nosotros.html">Nosotros</a>
        </div>

        <!-- Botón Ingresar (ver index.html) -->
        <a href="login.html" class="boton-ingresar" aria-label="Ingresar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path>
            </svg>
            <span class="boton-ingresar-texto">Ingresar</span>
        </a>
    </nav>

    <!-- Reutiliza las clases del login: misma tarjeta, mismos campos -->
    <div class="login">
        <div class="login-card">

            <div class="login-logo">
                <h1>Creá tu cuenta</h1>
                <p>Empezá a cuidar tus ahorros</p>
            </div>

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Martina">
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com">
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••">
            </div>

            <div class="campo">
                <label for="confirmar">Repetí la contraseña</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="••••••••">
            </div>

            <button type="button" id="btn-crear" class="boton">Crear cuenta</button>

            <!-- Vacío: el JS escribe acá si algo está mal -->
            <p id="mensaje"></p>

            <div class="login-links">
                <p>¿Ya tenés cuenta? <a href="login.html">Ingresar</a></p>
                <a href="index.html">← Volver</a>
            </div>

        </div>
    </div>

    <!-- 1. La librería de Supabase (desde internet) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <!-- 2. Nuestra conexión (usa la librería, por eso va después) -->
    <script src="js/supabase.js"></script>
    <!-- 3. El JS de esta página (usa la conexión, por eso va último) -->
    <script src="js/registro.js"></script>
</body>
</html>
